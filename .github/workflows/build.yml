name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Konfiguracja Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generowanie projektu i kompilacja APK
        run: |
          flutter create konwerter_app
          cd konwerter_app
          flutter pub add image_picker pdf path_provider open_filex
          cp ../main.dart lib/main.dart
          flutter build apk --release

      - name: Zapisz plik APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: konwerter-apk
          path: konwerter_app/build/app/outputs/flutter-apk/app-release.apk
